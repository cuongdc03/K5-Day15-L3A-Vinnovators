<title>Sổ thực địa Ocean Park</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Bố cục: một cột cho điện thoại, đọc được ngoài nắng. Đầu trang dính: khu + tiến độ + người đi kiểm.
   Danh sách quán → bấm vào quán mở phiếu kiểm. Màu nhấn lấy từ mặt nước biển hồ (lagoon). */
:root {
  --bg: #F3F6F5; --surface: #FFFFFF; --ink: #0F1F1E; --muted: #52625F; --line: #D5DEDB;
  --accent: #0B6E78; --accent-ink: #FFFFFF; --accent-soft: #DCEFF0;
  --ok: #1D7A46; --ok-soft: #DDF1E4; --bad: #B3261E; --bad-soft: #F8E0DD;
  --warn: #8A5A00; --warn-soft: #F6EBCF; --none: #5E6B68; --none-soft: #E6EBEA;
  --display: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1716; --surface: #15211F; --ink: #E7EFED; --muted: #9DB0AC; --line: #2A3A37;
  --accent: #4FC2CC; --accent-ink: #062226; --accent-soft: #163B3F;
  --ok: #63C98D; --ok-soft: #173326; --bad: #F08B82; --bad-soft: #3A1C1A;
  --warn: #E5B654; --warn-soft: #3A2E12; --none: #A3B1AE; --none-soft: #243230; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1716; --surface: #15211F; --ink: #E7EFED; --muted: #9DB0AC; --line: #2A3A37;
  --accent: #4FC2CC; --accent-ink: #062226; --accent-soft: #163B3F;
  --ok: #63C98D; --ok-soft: #173326; --bad: #F08B82; --bad-soft: #3A1C1A;
  --warn: #E5B654; --warn-soft: #3A2E12; --none: #A3B1AE; --none-soft: #243230; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 800 1.15rem/1.2 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.who { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; }
select, input, textarea, button { font: inherit; color: inherit; }
select, input[type=text], input[type=search], input[type=number], input[type=url], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
textarea { min-height: 72px; resize: vertical; }
.who select { width: auto; min-height: 36px; padding: 4px 8px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 36px; white-space: nowrap; cursor: pointer; font-weight: 600; font-size: .88rem; }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.progress { display: grid; gap: 4px; }
.progress .bar { height: 8px; border-radius: 99px; background: var(--none-soft); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.progress small { color: var(--muted); font-variant-numeric: tabular-nums; }
main .wrap { padding-block: 14px 120px; display: grid; gap: 12px; }
.filters { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.list { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: left; width: 100%; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card b { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.card .meta { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; min-width: 0; overflow-wrap: anywhere; }
.pill { justify-self: end; align-self: start; font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
.pill.todo { border-color: var(--line); color: var(--muted); background: transparent; }
.pill.open { background: var(--ok-soft); color: var(--ok); }
.pill.closed { background: var(--bad-soft); color: var(--bad); }
.pill.moved { background: var(--warn-soft); color: var(--warn); }
.pill.not_found { background: var(--none-soft); color: var(--none); }
.src { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.note { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); }
.note strong { color: var(--ink); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 99px; padding: 14px 20px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 0; cursor: pointer; }
.sheet { display: grid; gap: 14px; }
.sheet h2 { font: 800 1.35rem/1.25 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 0; }
.facts dt { color: var(--muted); font-size: .85rem; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts a, .history a { color: var(--accent); }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; margin: 0; display: grid; gap: 12px; background: var(--surface); min-width: 0; }
legend { font-weight: 800; padding: 0 6px; }
label.f { display: grid; gap: 4px; font-weight: 600; font-size: .9rem; min-width: 0; }
label.f small { color: var(--muted); font-weight: 400; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.status { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; cursor: pointer; font-weight: 600; }
.status input { accent-color: var(--accent); width: 18px; height: 18px; }
.status label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.dish { display: grid; grid-template-columns: 1fr 96px 40px; gap: 6px; }
.dish button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.thumbs figure { margin: 0; position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--none-soft); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs figcaption { position: absolute; inset: auto 0 0; font-size: .7rem; background: rgba(0,0,0,.55); color: #fff; padding: 2px 6px; }
.history { display: grid; gap: 6px; font-size: .88rem; }
.history div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; }
.err { color: var(--bad); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.mono { font-family: var(--mono); font-size: .8rem; }
footer .wrap { padding-block: 0 24px; color: var(--muted); font-size: .82rem; display: grid; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Sổ thực địa Ocean Park</h1>
      <label class="who" for="visitor">Người kiểm
        <select id="visitor">
          <option value="">chọn tên</option>
          <option value="cuong">Cường</option>
          <option value="duc">Đức</option>
          <option value="truong">Trường</option>
          <option value="thai">Thái</option>
          <option value="other">Người khác</option>
        </select>
      </label>
    </div>
    <div class="tabs" role="group" aria-label="Chế độ">
      <button class="tab" type="button" data-mode="desk" aria-pressed="false">Kiểm tại bàn</button>
      <button class="tab" type="button" data-mode="field" aria-pressed="true">Đi thực địa</button>
    </div>
    <div class="tabs" role="group" aria-label="Khu">
      <button class="tab" type="button" data-area="ocean_park_1" aria-pressed="true">Ocean Park 1</button>
      <button class="tab" type="button" data-area="ocean_park_2" aria-pressed="false">Ocean Park 2</button>
      <button class="tab" type="button" data-area="" aria-pressed="false">Cả hai</button>
    </div>
    <div class="progress" aria-live="polite">
      <div class="bar"><i id="bar"></i></div>
      <small id="progressText">Đang tải danh sách quán…</small>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<footer>
  <div class="wrap">
    <div class="row"><button class="btn" type="button" id="exportBtn">Tải phiếu kiểm (CSV)</button></div>
    <span>Không chụp mặt người, biển số xe. Không ghi tên chủ quán hay khách. Số điện thoại chỉ ghi số của quán in trên biển hoặc menu.</span>
  </div>
</footer>
<button class="fab" type="button" id="addBtn">+ Thêm quán mới</button>

<script>
(() => {
  const AREA_NAMES = { ocean_park_1: "Ocean Park 1", ocean_park_2: "Ocean Park 2" };
  const AREA_DISTRICT = { ocean_park_1: "gia_lam", ocean_park_2: "van_giang" };
  const STATUS = { open: "Đang mở", closed: "Đã đóng cửa", moved: "Chuyển chỗ", not_found: "Không tìm thấy" };
  const CATEGORY = { restaurant: "Nhà hàng, quán ăn", cafe: "Cà phê, trà, tráng miệng", fast_food: "Đồ ăn nhanh",
    street_food: "Ăn vặt, vỉa hè", bakery: "Tiệm bánh", other: "Khác" };
  const VISITORS = { cuong: "Cường", duc: "Đức", truong: "Trường", thai: "Thái", other: "Người khác" };
  // Trạng thái xác thực do crawl/verify.py tính từ kiểm tại bàn, thực địa, Foody, OSM
  const AUTO = { field_verified: "Đã kiểm thực địa", desk_verified: "Maps còn hoạt động, có review gần đây",
    closed: "Đã đóng cửa (theo Maps)", auto_verified: "Google xác nhận còn mở", uncertain: "Chưa chắc, cần kiểm",
    unverified: "Chưa đối chiếu" };
  // Kiểm tại bàn: người kiểm mở Google Maps của quán rồi ghi lại những gì thấy
  const MAPS_STATUS = { open: "Còn hoạt động", closed_temporarily: "Tạm đóng cửa", closed_permanently: "Đóng cửa vĩnh viễn", not_found: "Không thấy trên Maps" };
  const MAPS_PILL = { open: "open", closed_temporarily: "moved", closed_permanently: "closed", not_found: "not_found" };
  const NEWEST = { lt_1m: "Dưới 1 tháng", lt_6m: "1–6 tháng", older: "Hơn 6 tháng", none: "Chưa có review" };

  const S = { places: new Map(), visits: [], deskChecks: [], mode: "field", area: "ocean_park_1", filter: "route", q: "", view: "list",
    placeId: null, drawnView: "", loaded: false, slow: false, error: "", canWrite: true, caps: {} };

  // ---------- tiện ích ----------
  const $ = (s) => document.querySelector(s);
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
    return el;
  }
  const norm = (t) => String(t || "").replace(/đ/g, "d").replace(/Đ/g, "D").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const isHttps = (u) => /^https:\/\/[^\s]+$/i.test(String(u || "").trim());
  const rid = (p) => p + Array.from(crypto.getRandomValues(new Uint8Array(4)), (b) => b.toString(16).padStart(2, "0")).join("");
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  function toast(msg) {
    const t = h("div", { class: "toast", role: "status", text: msg });
    document.body.append(t); setTimeout(() => t.remove(), 2600);
  }
  const fmtTime = (iso) => { try { return new Date(iso).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" }); } catch { return iso; } };
  const mapsLink = (p) => `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  // Tìm theo tên + địa chỉ để Maps mở đúng trang quán (có review, ảnh), không chỉ một chấm toạ độ
  const mapsSearch = (p) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([p.name, p.address || AREA_NAMES[p.area]].filter(Boolean).join(", "));
  const doneOf = (p) => S.mode === "desk" ? p.desk_last : p.last;
  const byName = (a, b) => norm(a.name).localeCompare(norm(b.name));

  // ---------- người đi kiểm ----------
  const visitorSel = $("#visitor");
  visitorSel.value = store.get("visitor") || "";
  visitorSel.addEventListener("change", () => store.set("visitor", visitorSel.value));

  // ---------- khu ----------
  document.querySelectorAll(".tab[data-area]").forEach((b) => b.addEventListener("click", () => {
    S.area = b.dataset.area;
    document.querySelectorAll(".tab[data-area]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    store.set("area", S.area); render();
  }));

  // ---------- chế độ: kiểm tại bàn (xem Google Maps) hoặc đi thực địa ----------
  function setMode(m) {
    S.mode = m; S.filter = m === "desk" ? "desk" : "route"; S.drawnView = "";
    document.querySelectorAll(".tab[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === m)));
    $("#exportBtn").textContent = m === "desk" ? "Tải kết quả kiểm tại bàn (CSV)" : "Tải phiếu thực địa (CSV)";
    store.set("mode", m); render();
  }
  document.querySelectorAll(".tab[data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));

  // ---------- hiển thị ----------
  let raf = 0;
  const render = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };

  function inArea(p) { return !S.area || p.area === S.area; }

  function drawProgress() {
    const all = [...S.places.values()].filter(inArea);
    const planned = all.filter((p) => p.field_priority);
    const desk = S.mode === "desk";
    const base = desk || !planned.length ? all : planned;  // đi thực địa: có lộ trình thì đo trên lộ trình
    const done = base.filter(doneOf).length;
    $("#bar").style.width = base.length ? (100 * done / base.length).toFixed(1) + "%" : "0";
    if (!S.loaded) { $("#progressText").textContent = S.slow ? "Chưa kết nối được kho dữ liệu, đang thử lại…" : "Đang tải danh sách quán…"; return; }
    const where = S.area ? AREA_NAMES[S.area] : "hai khu";
    const deskDone = all.filter((p) => p.desk_last).length;
    $("#progressText").textContent = desk ? `Đã kiểm tại bàn ${deskDone}/${all.length} quán ở ${where}`
      : (planned.length ? `Đã đi ${done}/${planned.length} quán trong lộ trình ở ${where}` : `Đã đi kiểm ${done}/${all.length} quán ở ${where}`)
        + ` · ${deskDone}/${all.length} quán đã kiểm tại bàn`;
  }

  function draw() {
    drawProgress();
    const view = $("#view");
    if (S.view === "list" && S.drawnView === "list" && document.getElementById("list") && !S.error) { renderListOnly(); return; }
    S.drawnView = S.view;
    view.replaceChildren(S.view === "place" ? drawPlace() : S.view === "new" ? drawNew() : drawList());
    $("#addBtn").hidden = S.view !== "list" || !S.canWrite;
  }

  function pillFor(p) {
    if (S.mode === "desk") {
      const ms = p.desk_last?.maps_status;
      return h("span", { class: "pill " + (MAPS_PILL[ms] || "todo"), text: ms ? MAPS_STATUS[ms] : "Chưa kiểm" });
    }
    const st = p.last?.status;
    return h("span", { class: "pill " + (st || "todo"), text: st ? STATUS[st] : "Chưa kiểm" });
  }

  function drawList() {
    const frag = h("div", { class: "sheet" });
    if (S.error) frag.append(h("div", { class: "note err", text: S.error }));
    const search = h("input", { type: "search", id: "q", placeholder: "Tìm tên quán, món, địa chỉ", value: S.q, "aria-label": "Tìm quán",
      oninput: (e) => { S.q = e.target.value; clearTimeout(drawList.t); drawList.t = setTimeout(() => { renderListOnly(); }, 120); } });
    const opts = S.mode === "desk"
      ? { desk: "Chưa kiểm (quán quan trọng trước)", done: "Đã kiểm", all: "Tất cả" }
      : { route: "Cần đi kiểm (theo lộ trình)", todo: "Chưa đi kiểm", done: "Đã đi kiểm", all: "Tất cả" };
    const filter = h("select", { id: "filter", "aria-label": "Lọc theo trạng thái", onchange: (e) => { S.filter = e.target.value; renderListOnly(); } },
      Object.entries(opts).map(([v, t]) => h("option", { value: v, text: t })));
    filter.value = S.filter;
    frag.append(h("div", { class: "filters" }, search, filter), h("div", { class: "list", id: "list" }));
    queueMicrotask(renderListOnly);
    return frag;
  }

  function renderListOnly() {
    const list = document.getElementById("list");
    if (!list) return;
    if (!S.loaded && !S.places.size) { list.replaceChildren(h("div", { class: "note", text: S.slow ? "Chưa tải được danh sách. Kiểm tra mạng rồi để trang tự thử lại." : "Đang tải danh sách quán…" })); return; }
    if (!S.places.size) {
      list.replaceChildren(h("div", { class: "note" }, h("strong", { text: "Chưa có quán nào trong danh sách. " }),
        "Danh sách quán crawl từ OSM và Foody sẽ hiện ở đây khi được nạp. Gặp quán chưa có thì bấm “Thêm quán mới”."));
      return;
    }
    const q = norm(S.q).trim();
    let rows = [...S.places.values()].filter(inArea);
    if (S.filter === "route") rows = rows.filter((p) => p.field_priority && !p.last);
    if (S.filter === "desk" || S.filter === "todo") rows = rows.filter((p) => !doneOf(p));
    if (S.filter === "done") rows = rows.filter(doneOf);
    if (q) rows = rows.filter((p) => norm([p.name, p.address, p.cuisine].join(" ")).includes(q));
    if (S.filter === "route") rows.sort((a, b) => (a.area || "").localeCompare(b.area || "") || (a.route_order || 1e9) - (b.route_order || 1e9));
    else if (S.filter === "desk") rows.sort(byDeskPriority);
    else rows.sort((a, b) => (!!doneOf(a) - !!doneOf(b)) || (a.field_priority || 1e9) - (b.field_priority || 1e9) || byName(a, b));
    if (!rows.length) {
      list.replaceChildren(h("div", { class: "note", text: S.filter === "route"
        ? "Không còn quán nào trong lộ trình ở khu này. Đổi khu, hoặc chọn “Chưa đi kiểm” để xem cả danh sách."

  async function shrink(file, max = 1600) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close?.();
    return await new Promise((res, rej) => c.toBlob((b) => b ? res(b) : rej(new Error("không nén được ảnh")), "image/jpeg", 0.82));
  }

  function parseCoords(text) {
    const t = String(text || "");
    const m = t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/[?&]q(?:uery)?=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{2,3}\.\d{3,})/);
    if (!m) return null;
    const lat = Number(m[1]), lng = Number(m[2]);
    return lat > 20.8 && lat < 21.3 && lng > 105.6 && lng < 106.1 ? { lat, lng } : null;
  }

    const nearOpts = [...S.places.values()].filter((p) => p.area === d.area).sort((a, b) => norm(a.name).localeCompare(norm(b.name)));
    const errBox = h("p", { class: "err", role: "alert" });
    const submit = h("button", { class: "btn primary", type: "submit", text: "Thêm quán" });
    return h("form", { class: "sheet", novalidate: true, onsubmit: async (e) => {
      e.preventDefault(); errBox.textContent = "";
      const problems = [];
      if (!visitorSel.value) problems.push("chọn tên người đi kiểm ở đầu trang");
      if (!d.name.trim()) problems.push("nhập tên quán");
      let pos = parseCoords(d.coords);
      if (!pos && d.near) { const n = S.places.get(d.near); if (n) pos = { lat: n.lat, lng: n.lng }; }
      if (!pos) problems.push("dán link Google Maps của quán, hoặc chọn một quán ngay cạnh");
      if (problems.length) { errBox.textContent = "Cần sửa: " + problems.join("; ") + "."; return; }
      submit.disabled = true;
      const id = rid("p_");
      try {
        await S.caps.db.collection("places").doc(id).set({ name: d.name.trim(), area: d.area, district: AREA_DISTRICT[d.area], category: d.category,
          address: d.address.trim(), cuisine: "", lat: pos.lat, lng: pos.lng, sources: "field", foody_url: "",
          added_in_field: true, coords_from: parseCoords(d.coords) ? "link" : "near:" + d.near, created_by: visitorSel.value, created_at: new Date().toISOString(), last: null });
        store.del("draft:new"); toast("Đã thêm " + d.name.trim() + ". Ghi phiếu kiểm luôn nhé."); openPlace(id);
      } catch (err) {
        submit.disabled = false;
        errBox.textContent = err?.code === "invalid_argument" ? "Tài khoản này không có quyền ghi." : "Chưa lưu được (" + (err?.code || "lỗi mạng") + "). Thử lại khi có sóng.";
      }
    } },
      h("button", { class: "back", type: "button", onclick: backToList, text: "← Danh sách" }),
      h("h2", { text: "Thêm quán chưa có trong danh sách" }),
      h("p", { style: "margin:0;color:var(--muted)", text: "Tìm trong danh sách trước để tránh thêm trùng. Quán đổi tên thì ghi vào phiếu của quán cũ." }),
      h("fieldset", {}, h("legend", { text: "Quán" }),
        h("label", { class: "f" }, "Tên trên biển", bind(h("input", { type: "text", id: "nw-name", placeholder: "vd Bún chả Hương Liên" }), "name")),
        h("div", { class: "two" },
          h("label", { class: "f" }, "Khu", bind(h("select", { id: "nw-area", onchange: () => setTimeout(render) }, Object.entries(AREA_NAMES).map(([v, t]) => h("option", { value: v, text: t }))), "area")),
          h("label", { class: "f" }, "Loại", bind(h("select", { id: "nw-cat" }, Object.entries(CATEGORY).map(([v, t]) => h("option", { value: v, text: t }))), "category"))),
        h("label", { class: "f" }, "Địa chỉ", h("small", { text: "Mã căn hoặc toà, vd S2.05 hoặc SH-12 Sao Biển." }), bind(h("input", { type: "text", id: "nw-addr" }), "address"))),
      h("fieldset", {}, h("legend", { text: "Vị trí" }),
        h("label", { class: "f" }, "Link Google Maps hoặc toạ độ", h("small", { text: "Trong Google Maps: giữ tay lên vị trí quán → chép toạ độ hoặc Chia sẻ → Sao chép link (link đầy đủ có @vĩ độ,kinh độ)." }),
          bind(h("input", { type: "text", id: "nw-coords", placeholder: "20.99331, 105.94170" }), "coords")),
        h("label", { class: "f" }, "Hoặc: ngay cạnh quán", bind(h("select", { id: "nw-near" }, h("option", { value: "", text: "chọn quán bên cạnh" }), nearOpts.map((p) => h("option", { value: p.id, text: p.name }))), "near"))),
      errBox, h("div", { class: "row" }, submit, h("button", { class: "btn", type: "button", text: "Huỷ", onclick: backToList })));
  }

  $("#addBtn").addEventListener("click", () => { S.view = "new"; render(); scrollTo(0, 0); });

  // ---------- xuất CSV ----------
  const csvCell = (v) => { const s = v == null ? "" : String(v); return /[",\n;]/.test(s) || /^[=+\-@]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  // Cột giống hệt data/processed/*.csv mà crawl/field_visits.py ghi
  const VISIT_COLS = ["visit_id", "place_id", "visitor", "visited_at", "status", "price_min_k", "price_max_k", "dishes", "hours_text", "phone",
    "facebook_url", "tiktok_url", "photo_urls", "lat", "lng", "notes"];
  const DESK_COLS = ["check_id", "place_id", "checker", "checked_at", "maps_status", "maps_review_count", "newest_review", "has_menu_photo", "notes"];
  $("#exportBtn").addEventListener("click", async () => {
    const desk = S.mode === "desk";
    const cols = desk ? DESK_COLS : VISIT_COLS;
    const rows = desk
      ? S.deskChecks.map((c) => ({ ...c, has_menu_photo: c.has_menu_photo ? 1 : 0 }))
      : S.visits.map((v) => ({ ...v, dishes: (v.dishes || []).map((x) => x.name + (x.price_k != null ? ":" + x.price_k : "")).join(";"),
          photo_urls: [...(v.photo_ids || []).map((id) => "asset:" + id), ...(v.photo_links || [])].join(";"), lat: "", lng: "" }));
    const lines = [cols.join(","), ...rows.map((r) => cols.map((c) => csvCell(r[c])).join(","))];
    const dl = S.caps.downloads;
    if (!dl) { toast("Trang này không tải file xuống được ở đây."); return; }
    try {
      await dl.save({ filename: desk ? "desk_checks.csv" : "field_visits.csv", data: "﻿" + lines.join("\n") + "\n" });
      toast(`Đã xuất ${rows.length} dòng.`);
    } catch (err) { if (err?.code !== "declined") toast("Chưa tải được file (" + (err?.code || "lỗi") + ")."); }
  });

  // ---------- kết nối dữ liệu ----------
  async function boot() {
    const C = window.claude;
    if (!C?.use) { S.error = "Trang cần mở trong claude.ai để đọc và ghi dữ liệu chung của nhóm."; S.loaded = true; render(); return; }
    const [db, user, assets, downloads] = await Promise.all(["db", "user", "assets", "downloads"].map((n) => C.use(n).catch(() => null)));
    S.caps = { db, user, assets, downloads };
    if (!db) { S.error = "Chưa kết nối được kho dữ liệu chung. Hãy đăng nhập claude.ai rồi mở lại trang."; S.loaded = true; render(); return; }
    if (user) {
      S.uid = await user.id();
      const w = await user.can("data.write");
      if (w === false) S.canWrite = false;
    }
    const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
    db.collection("places").onSnapshot((snap) => {
      S.places = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      if (!snap.metadata.fromCache) { S.loaded = true; S.slow = false; clearTimeout(timer); }
      if (S.view === "list") render(); else drawProgress();
    }, (err) => { clearTimeout(timer); S.loaded = true; S.error = "Mất kết nối kho dữ liệu (" + err.code + "). Tải lại trang."; render(); });
    db.collection("visits").onSnapshot((snap) => {
      S.visits = snap.docs.map((d) => ({ visit_id: d.id, ...d.data() }));
      if (S.view === "list") render();
    }, () => {});
    db.collection("desk_checks").onSnapshot((snap) => {
      S.deskChecks = snap.docs.map((d) => ({ check_id: d.id, ...d.data() }));
      if (S.view === "list") render();
    }, () => {});
    render();
  }
  // Khôi phục khu và chế độ đã chọn lần trước (sau khi mọi hàm đã khai báo)
  const savedArea = store.get("area");
  if (savedArea !== null) document.querySelector(`.tab[data-area="${savedArea}"]`)?.click();
  setMode(store.get("mode") || "desk");
  boot();
})();
</script>
